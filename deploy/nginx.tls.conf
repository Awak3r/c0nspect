# Per-site replacement for nginx.bootstrap.conf AFTER certificate issuance.
# Change the domain in server_name, redirect and certificate paths together.
# If CONSPECT_HTTP_PORT changes, update proxy_pass to the same loopback port.
server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/conspect-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://notes.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name notes.example.com;

    ssl_certificate /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16m;

    # Preserve app-specific headers, especially the reader/admin referrer split.
    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        # Single trusted proxy: discard any client-supplied forwarding chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
