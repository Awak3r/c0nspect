# Production behind an EXISTING host nginx. Do not combine with compose.local.yaml.
services:
  app:
    image: ${CONSPECT_IMAGE:-conspect:local}
    ports:
      - "127.0.0.1:${CONSPECT_HTTP_PORT:-8096}:8080"
    environment:
      TRUST_PROXY: "true"
      GOMEMLIMIT: 192MiB
      GOMAXPROCS: "1"
    mem_limit: 256m

  db:
    mem_limit: 256m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
