# Production behind an EXISTING external HTTPS proxy. Do not combine with compose.local.yaml.
# The legacy filename is retained for existing releases, backups and systemd units.
x-installation-labels: &installation-labels
  io.conspect.installation: ${CONSPECT_INSTALLATION_ID:-legacy}

services:
  app:
    labels: *installation-labels
    image: ${CONSPECT_IMAGE:-conspect:local}
    ports:
      - "127.0.0.1:${CONSPECT_HTTP_PORT:-8096}:8080"
    environment:
      TRUST_PROXY: "true"
      MCP_ENABLED: ${MCP_ENABLED:-true}
      GOMEMLIMIT: 192MiB
      GOMAXPROCS: "1"
    mem_limit: 256m

  db:
    labels: *installation-labels
    mem_limit: 256m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB

volumes:
  db_data:
    labels: *installation-labels
  uploads:
    labels: *installation-labels

networks:
  frontend:
    labels: *installation-labels
  backend:
    labels: *installation-labels
