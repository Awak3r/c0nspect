# Initial, per-site HTTP-only configuration. No certificate is needed yet.
# Install ONLY this example until certbot issuance succeeds; do not enable both
# bootstrap and TLS files simultaneously. Do not modify global nginx settings.
server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/conspect-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Never proxy owner forms, bearer requests or share URLs over plain HTTP.
    location / {
        default_type text/plain;
        return 503 "Conspect is waiting for TLS setup.\n";
    }
}
