name: conspect

services:
  app:
    image: conspect:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ADDR: ":8080"
      APP_BASE_URL: ${APP_BASE_URL:?Set the canonical APP_BASE_URL in .env}
      APP_SECRET: ${APP_SECRET:?Set a stable 64-hex-character APP_SECRET in .env}
      OWNER_USERNAME: ${OWNER_USERNAME:-admin}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      DATA_DIR: /data
      MAX_MARKDOWN_BYTES: ${MAX_MARKDOWN_BYTES:-2097152}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-1073741824}
      TRUST_PROXY: "true"
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_API_URL: http://127.0.0.1:8080
    volumes:
      - uploads:/data/uploads
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conspect}
      POSTGRES_USER: ${POSTGRES_USER:-conspect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  uploads:

networks:
  frontend:
  backend:
    internal: true
